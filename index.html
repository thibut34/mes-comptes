<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes Comptes</title>
<meta name="description" content="Gérez vos relevés La Banque Postale : import PDF, catégories, budgets, prévisions et objectifs. Vos données restent sur votre téléphone.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes Comptes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: one-column phone app — sticky header (brand or back + period), scrolling view, frosted bottom tab bar, bottom sheets. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F4F7F5; --fg:#13201B; --muted:#5B6B65; --line:#DFE6E2;
  --accent:#0B6E55; --accent-2:#0E8566; --accent-soft:#D7EEE6; --accent-ink:#FFFFFF;
  --in:#13803F; --warn:#B86A00; --warn-soft:#FBEBD2; --danger:#C0362C; --danger-soft:#F8DEDB;
  --shadow:0 1px 2px rgba(19,32,27,.05),0 8px 24px rgba(19,32,27,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --nav-h:62px; --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1210; --surface:#141E1B; --surface-2:#1A2622; --fg:#E6EEEA; --muted:#93A59E; --line:#24322D;
  --accent:#3CC79C; --accent-2:#2FAE87; --accent-soft:#163A30; --accent-ink:#04231A;
  --in:#4ED68A; --warn:#F0A43A; --warn-soft:#3A2B12; --danger:#FF7B6E; --danger-soft:#3D1D1A;
  --shadow:0 0 0 1px rgba(255,255,255,.04); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1210; --surface:#141E1B; --surface-2:#1A2622; --fg:#E6EEEA; --muted:#93A59E; --line:#24322D;
  --accent:#3CC79C; --accent-2:#2FAE87; --accent-soft:#163A30; --accent-ink:#04231A;
  --in:#4ED68A; --warn:#F0A43A; --warn-soft:#3A2B12; --danger:#FF7B6E; --danger-soft:#3D1D1A;
  --shadow:0 0 0 1px rgba(255,255,255,.04); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease, background-color .15s ease, opacity .15s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.hiding main,body.hiding header{filter:blur(18px)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px;padding-block:8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.025em;flex:1;min-width:0;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.back{display:flex;align-items:center;gap:4px;background:none;border:0;padding:6px 4px;color:var(--accent);font-weight:700;font-size:15px}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.subtitle{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:52px}
.period{appearance:none;-webkit-appearance:none;background-color:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 32px 8px 14px;font-weight:600;font-size:14px;max-width:52vw;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}

main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
#view{display:flex;flex-direction:column;gap:14px;padding-block:4px 0}
#view.enter>*{animation:enter .5s cubic-bezier(.2,.8,.2,1) both}
#view.enter>:nth-child(2){animation-delay:.05s} #view.enter>:nth-child(3){animation-delay:.1s} #view.enter>:nth-child(4){animation-delay:.15s}
#view.enter>:nth-child(5){animation-delay:.2s} #view.enter>:nth-child(6){animation-delay:.25s} #view.enter>:nth-child(n+7){animation-delay:.3s}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em;text-wrap:balance;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.card h2 .act{margin-left:auto}
.label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.pos{color:var(--in)} .bad{color:var(--danger)} .warnc{color:var(--warn)}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--muted);margin:8px 2px -4px}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.hero .label{color:inherit;opacity:.8}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:42px;line-height:1;letter-spacing:-.035em}
.hero .spark{height:46px;margin:0 -4px}
.hero .spark svg{width:100%;height:100%;display:block}
.hero .row{display:flex;gap:8px;flex-wrap:wrap}
.hero .pill{background:rgba(255,255,255,.15);border-radius:14px;padding:8px 12px;font-size:13px;flex:1;min-width:120px}
.hero .pill b{display:block;font-size:16px}
:root[data-theme="dark"] .hero .pill{background:rgba(0,0,0,.15)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .pill{background:rgba(0,0,0,.15)}}
.verified{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;opacity:.92}
.verified svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border-radius:16px;padding:12px 10px;box-shadow:var(--shadow);min-width:0}
.kpi .label{font-size:10.5px}
.kpi b{display:block;font-size:15px;font-weight:700;margin-top:2px;letter-spacing:-.01em;overflow-wrap:anywhere}

/* feature tile (forecast teaser) */
.tile{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);text-align:left;width:100%}
.tile .gl{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .gl svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:16px}
.tile .chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile>div{min-width:0}

/* donut */
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:380px){.donut-wrap{grid-template-columns:1fr}.donut-wrap svg{margin:0 auto}}
.donut{animation:spin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{from{transform:rotate(-40deg) scale(.92);opacity:0}to{transform:none;opacity:1}}
.legend{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend button{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;background:none;border:0;padding:6px 4px;border-radius:8px;text-align:left;font-size:14px;min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tx rows */
.list{display:flex;flex-direction:column}
.row-tx{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.row-tx:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:14px;flex:none}
.ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row-tx .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-tx .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-tx .a{font-weight:700;text-align:right;white-space:nowrap}
.row-tx>div{min-width:0}
.day{display:flex;justify-content:space-between;padding:12px 2px 4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.day span:first-child::first-letter{text-transform:uppercase}

/* filters */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.selects{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selects select,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-size:15px}
.summary-bar{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 2px}

/* progress rows */
.bud{display:flex;flex-direction:column;gap:6px;padding:11px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud .h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.bud .h b{font-weight:600}
.bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.bud form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--danger-soft);color:var(--danger)} .tag.ok{background:var(--accent-soft);color:var(--accent)}

/* goals */
.goal{display:grid;grid-template-columns:54px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.goal:last-child{border-bottom:0}
.goal>div{min-width:0}
.ring{width:54px;height:54px}
.goal .n{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .m{font-size:12.5px;color:var(--muted)}

/* buttons & fields */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:7px 12px;border-radius:10px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.linkish{background:none;border:0;color:var(--accent);font-weight:700;padding:0;font-size:13.5px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface-2);font-size:16px}
.inline-in{width:110px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface-2);font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.switch{position:relative;width:51px;height:31px;border-radius:999px;border:0;background:var(--line);flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--in)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* insights */
.insights{display:flex;flex-direction:column;gap:10px}
.ins{display:grid;grid-template-columns:5px 1fr;gap:12px}
.ins i{border-radius:6px;background:var(--accent)}
.ins.warn i{background:var(--warn)} .ins.bad i{background:var(--danger)}
.ins p{margin:0;font-size:14px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;white-space:nowrap}
.scroll-x{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--f-body)}
.share{display:block;height:4px;border-radius:4px;margin-top:5px}

/* calendar */
.ev{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{text-align:center;background:var(--surface-2);border-radius:10px;padding:5px 0;line-height:1.1}
.ev .d b{display:block;font-family:var(--f-display);font-size:17px}
.ev .d span{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700}
.ev>div{min-width:0}
.ev .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* menu */
.menu{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.menu button{display:grid;grid-template-columns:36px 1fr 18px;gap:12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.menu button:last-child{border-bottom:0}
.menu .gl{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff}
.menu .gl svg,.menu .chev{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.menu .chev{stroke:var(--muted)}
.menu b{display:block;font-weight:600}
.menu span{font-size:12.5px;color:var(--muted)}
.menu>button>div{min-width:0}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){nav.tabs{background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.3}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:4px;background:var(--line);margin:0 auto}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0}
.sheet .amt{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.catgrid{display:flex;flex-wrap:wrap;gap:8px}
.catgrid button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.catgrid button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* lock screen */
#lock{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
#lock img{width:72px;height:72px;border-radius:18px;box-shadow:var(--shadow)}
#lock h1{font-family:var(--f-display);font-size:22px;margin:0;text-align:center}
#lock p{margin:-12px 0 0;color:var(--muted);font-size:14px;text-align:center;min-height:20px}
.dots{display:flex;gap:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--fg);display:block}
.dots i.on{background:var(--fg)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.keypad button{width:76px;height:76px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-family:var(--f-display);font-size:28px;font-weight:600}
.keypad button.txt{background:none;box-shadow:none;font-family:var(--f-body);font-size:15px;font-weight:700;color:var(--accent)}

.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:12px;align-items:center}

.notice{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stmt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stmt:last-child{border-bottom:0}
.stmt>div{min-width:0}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.sl{display:flex;flex-direction:column;gap:4px;padding:8px 0}
.sl .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sl label{font-weight:600;font-size:14px}
.sl output{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:30px;margin:0}
.bigv{font-family:var(--f-display);font-weight:800;font-size:36px;letter-spacing:-.03em;line-height:1.05}
.ind{display:flex;flex-direction:column;gap:7px;padding:13px 0;border-bottom:1px solid var(--line)}
.ind:last-child{border-bottom:0}
.ind .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ind .h b{font-weight:600}
.ind .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.gauge{position:relative;height:10px;border-radius:6px;background:var(--surface-2)}
.gauge i{display:block;height:100%;border-radius:6px;transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1)}
.gauge .mk{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--fg);opacity:.7}
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.score .ring{width:92px;height:92px}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cal-d{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;color:var(--fg);line-height:1.05;min-width:0}
.cal-d b{font-size:13px}
.cal-d small{font-size:10px;font-weight:600;opacity:.85;min-height:10px}
.legend-inline{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend-inline span{display:inline-flex;align-items:center;gap:6px}

.mood svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.curve{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;margin:0 -4px}
.curve svg{display:block;overflow:visible}
.curve .tip{position:absolute;top:-8px;background:var(--fg);color:var(--bg);border-radius:12px;padding:6px 10px;font-size:12px;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap;z-index:2}
.curve .tip b{font-size:16px;font-family:var(--f-display)} .curve .tip b.bad{color:#FF9C92}
.curve .tip small{opacity:.8;font-size:11.5px}

.ctag.bad{fill:var(--danger)!important}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) .15s forwards}

.fade-in{animation:fade 1s ease-out .4s both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}

@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}

.grow-y.down{transform-origin:top}
@keyframes growy{from{transform:scaleY(0)}}
.tl{position:relative;display:flex;flex-direction:column}
.tl::before{content:"";position:absolute;left:55px;top:14px;bottom:14px;width:2px;border-radius:2px;background:var(--line)}
.tl-i{position:relative;display:grid;grid-template-columns:42px 12px 1fr auto;gap:10px;align-items:center;padding:9px 0;background:none;border:0;text-align:left;width:100%;animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
.tl-i.past{opacity:.5}
.tl-d{display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;line-height:1.1}

.tl-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-t small{font-size:12.5px;color:var(--muted)}
.tl-i>b{font-weight:700;white-space:nowrap}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.vs{display:flex;flex-direction:column;gap:8px;margin-top:12px}

.vs>div>span{color:var(--muted);font-weight:600}

.cchip .ico{grid-row:span 2;width:30px;height:30px;border-radius:10px;font-size:11px}
.cchip .ico svg{width:16px;height:16px}
.cchip span{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.cchip b{font-size:14px;white-space:nowrap}
.cchip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.daybars{padding:12px 14px 8px}
.db-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dbar{cursor:pointer}
.catpick summary{list-style:none;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--surface-2);border-radius:16px;padding:10px 12px;cursor:pointer}
.catpick summary::-webkit-details-marker{display:none}
.catpick summary>span{display:flex;flex-direction:column;min-width:0}
.catpick[open] summary{margin-bottom:6px}
.catpick[open] summary .linkish{visibility:hidden}
.tile .mini{grid-column:1/-1;height:34px;color:var(--accent);margin:-4px 0 -2px}
.tile .mini svg{width:100%;height:100%;display:block}
.tile .mini.bad{color:var(--danger)}
.fold{display:flex;flex-direction:column;gap:14px}
.fold>summary{list-style:none;cursor:pointer;text-align:center;font-weight:700;font-size:14px;color:var(--accent);padding:10px;border-radius:14px;background:var(--surface-2)}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:" ▾"}
.fold[open]>summary::after{content:" ▴"}
@media (prefers-reduced-motion:reduce){.draw{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function alertsFor(s) {

    const older = new Set(allTx().filter(t => t.sid !== s.id && t.date < s.end).map(t => t.key));
    for (const t of pt) if (t.type === "prelevement" && !older.has(t.key)) { out.push(["", `Nouveau prélèvement : <b>${esc(title(t.merchant))}</b>, ${eur(-t.amount)} le ${sDate(t.date)}.`]); older.add(t.key); }

  }

}

function personOf(t) {

  const w = [];
  for (const x of String(t.merchant).split(/\s+/)) { if (x && w.length < 3 && x === x.toUpperCase() && /\p{L}/u.test(x)) w.push(x); else break; }

function people() {

  for (const t of allTx()) { const n = personOf(t); if (!n) continue; const p = get(n); p.txs.push(t); if (t.amount < 0) p.sent -= t.amount; else p.received += t.amount; }
  for (const e of S.settings.debts || []) { const p = get(e.who); p.entries.push(e); p.owed += e.amount; }
  const list = Object.values(P).map(p => ({ ...p, sent:r2(p.sent), received:r2(p.received), owed:r2(p.owed) }))

    case "del-ok": S.confirm = null; await deleteStatement(el.dataset.id); toast("Relevé supprimé."); break;
    case "rule-del": delete S.settings.rules[el.dataset.k]; saveSettings(); render(); break;
    case "goal-new": showSheet("goal", ""); break;
    case "goal-del": S.confirm = "goal-del"; openSheet(sheetGoal(el.dataset.id)); S.sheetOpen = ["goal", el.dataset.id]; break;
    case "goal-del-ok": S.settings.goals = S.settings.goals.filter(g => g.id !== el.dataset.id); saveSettings(); closeSheet(); render(); toast("Objectif supprimé."); break;
    case "goal-sub": { const g = S.settings.goals.find(x => x.id === el.dataset.id); const v = parseFloat(String($("#goal-add").value).replace(",", ".")); if (!(v > 0)) { toast("Indiquez un montant."); break; } g.saved = Math.max(r2((g.saved || 0) - v), 0); saveSettings(); render(); refreshSheet(); break; }
    case "cat-reset": delete S.settings.catEdits[el.dataset.k]; saveSettings(); closeSheet(); render(); break;
    case "cat-del": S.confirm = "cat-del"; openSheet(sheetCat(el.dataset.k)); S.sheetOpen = ["cat", el.dataset.k]; break;
    case "cat-del-ok": { const k = el.dataset.k; delete S.settings.cats[k]; for (const [r, c] of Object.entries(S.settings.rules)) if (c === k) delete S.settings.rules[r]; for (const [r, c] of Object.entries(S.settings.overrides)) if (c === k) delete S.settings.overrides[r]; delete S.settings.budgets[k]; saveSettings(); closeSheet(); render(); toast("Catégorie supprimée."); break; }
    case "export-csv": exportCSV(); break;
    case "export-json": saveFile(`mes-comptes-sauvegarde-${iso(new Date())}.json`, JSON.stringify({ app:"mes-comptes", version:2, savedAt:new Date().toISOString(), statements:S.statements, settings:S.settings }), "application/json"); break;
    case "wipe": S.confirm = "wipe"; render(); break;
    case "wipe-ok": S.confirm = null; S.statements = []; S.settings = defaults(); S.live = []; S.liveDone = []; await persist("statements", []); await persist("live", { live:[], done:[] }); saveSettings(); S.importMsg = null; go("home"); toast("Toutes vos données ont été effacées."); break;
    case "lock-on": S.pad = { mode:"set1", value:"" }; renderLock(); break;
    case "lock-off": S.confirm = "lock-off"; render(); break;
    case "lock-off-ok": S.lock = { enabled:false }; S.confirm = null; await saveLock(); render(); toast("Verrouillage désactivé."); break;
    case "pin-change": S.pad = { mode:"check", value:"" }; renderLock(); break;
    case "pad-cancel": S.pad = null; renderLock(); break;
    case "face-on": faceOn(); break;
    case "face-off": S.lock.faceid = false; delete S.lock.credId; await saveLock(); render(); break;
    case "face-unlock": faceUnlock(); break;
    case "day-clear": delete S.f.date; render(); break;
    case "summary-img": toast("Création de l'image…"); summaryImage().catch(() => toast("Impossible de créer l'image.")); break;
    case "debt-new": showSheet("debt", el.dataset.who || "", el.dataset.tx || ""); break;
    case "sug-ok": { const t = allTx().find(x => x.id === el.dataset.tx); S.settings.debts.push({ id:uid(), who:el.dataset.who, amount:r2(-t.amount), label:"Remboursement par virement", date:t.date, txId:t.id }); saveSettings(); render(); toast("Remboursement enregistré."); break; }
    case "sug-no": S.settings.debtIgnored.push(el.dataset.tx); saveSettings(); render(); break;
    case "entry-del": S.settings.debts = S.settings.debts.filter(x => x.id !== el.dataset.id); saveSettings(); render(); refreshSheet(); break;
    case "settle": { const p = people().find(x => x.name === el.dataset.who); if (p && Math.abs(p.owed) >= 0.01) S.settings.debts.push({ id:uid(), who:p.name, amount:r2(-p.owed), label:"Réglé", date:iso(new Date()) }); saveSettings(); render(); refreshSheet(); toast("C'est réglé."); break; }
    case "round-add": { const g = S.settings.goals.find(x => x.id === $("#round-goal").value); const v = +el.dataset.amount; if (!g || !(v > 0)) break; g.saved = r2((g.saved || 0) + v); S.settings.roundDone[el.dataset.sid] = { amount:v, goal:g.name }; saveSettings(); render(); toast(`${eur(v)} ajoutés à « ${g.name} ».`); break; }
    case "ch-new": showSheet("challenge", "visits"); break;
    case "loan-new": showSheet("loan", ""); break;
    case "loan-del": S.confirm = "loan-del"; openSheet(sheetLoan(el.dataset.id)); S.sheetOpen = ["loan", el.dataset.id]; break;
    case "loan-del-ok": S.settings.loans = loans().filter(l => l.id !== el.dataset.id); saveSettings(); closeSheet(); render(); toast("Crédit supprimé."); break;
    case "ch-del": S.settings.challenges = S.settings.challenges.filter(c => c.id !== el.dataset.id); saveSettings(); render(); break;
  }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-form]"); if (!f) return; e.preventDefault();
  if (f.dataset.form === "budget") {
    const k = f.dataset.k, v = parseFloat(String($("#bud-" + k).value).replace(",", "."));
    if (v > 0) S.settings.budgets[k] = r2(v); else delete S.settings.budgets[k];
    S.editBudget = null; saveSettings(); render(); toast("Budget enregistré.");
  } else if (f.dataset.form === "goal") readGoalForm(f.dataset.id);
  else if (f.dataset.form === "pea") {
    const v = parseFloat(String($("#pea-v").value).replace(",", "."));
    if (v > 0) S.settings.pea = { value:r2(v), date:iso(new Date()) }; else delete S.settings.pea;
    saveSettings(); render(); toast(v > 0 ? "Valeur du PEA enregistrée." : "Valeur du PEA effacée.");
  }
  else if (f.dataset.form === "goal-add") {
    const g = S.settings.goals.find(x => x.id === f.dataset.id); const v = parseFloat(String($("#goal-add").value).replace(",", "."));
    if (!(v > 0)) { toast("Indiquez un montant."); return; }
    g.saved = r2((g.saved || 0) + v); saveSettings(); render(); refreshSheet(); toast(`${eur(v)} ajoutés à « ${g.name} ».`);
  } else if (f.dataset.form === "loan") {
    const n = (id) => parseFloat(String($(id).value).replace(",", "."));
    const data = { name:$("#ln-name").value.trim(), type:$("#ln-type").value, amount:n("#ln-amount"), rate:n("#ln-rate") || 0, months:parseInt($("#ln-months").value), start:$("#ln-start").value, day:Math.min(Math.max(parseInt($("#ln-day").value) || 5, 1), 28), insurance:n("#ln-ins") || 0, key:$("#ln-key") ? $("#ln-key").value : "" };
    if (!data.name || !(data.amount > 0) || !(data.months > 0) || !data.start) { toast("Indiquez le nom, la somme, la durée et la date."); return; }
    const id = f.dataset.id;
    if (id) Object.assign(loans().find(l => l.id === id), data); else loans().push({ id:uid(), ...data });
    saveSettings(); if (S.view !== "loans") go("loans"); else render();
    if (id) { closeSheet(); toast("Crédit enregistré."); } else { showSheet("loan", loans()[loans().length - 1].id); toast("Crédit ajouté."); }
  } else if (f.dataset.form === "debt") {
    const who = $("#d-who").value.trim().toUpperCase().replace(/\s+/g, " "), v = parseFloat(String($("#d-amount").value).replace(",", "."));
    if (!who || !(v > 0)) { toast("Indiquez une personne et un montant."); return; }
    const t = f.dataset.tx ? allTx().find(x => x.id === f.dataset.tx) : null;
    S.settings.debts.push({ id:uid(), who, amount:r2(v * +$("#d-dir").value), label:$("#d-label").value.trim(), date: t ? t.date : iso(new Date()) });
    saveSettings(); closeSheet(); if (S.view !== "people") go("people"); else render(); toast("C'est noté.");
  } else if (f.dataset.form === "challenge") {
    const type = f.dataset.type, target = parseFloat(String(($("#ch-target") || {}).value || "").replace(",", "."));
    if (!(target >= 0)) return;
    const c = { id:uid(), type, target:r2(target), created: (sorted()[0] || { end:iso(new Date()) }).end };
    if (type === "visits") { const o = $("#ch-key").selectedOptions[0]; c.key = o.value; c.name = o.dataset.name; }
    if (type === "cat") c.cat = $("#ch-cat").value;
    S.settings.challenges.push(c); saveSettings(); closeSheet(); render(); toast("Défi lancé. Résultat à votre prochain relevé.");
  } else if (f.dataset.form === "cat") {
    const k = f.dataset.k, name = $("#c-name").value.trim(), color = $("#g-color").value; if (!name) return;
    if (!k) { S.settings.cats["c_" + uid()] = { l:name, c:color, k:$("#c-kind").value }; toast("Catégorie créée. Choisissez-la depuis une opération."); }
    else if (CATS[k].base) S.settings.catEdits[k] = { l:name, c:color };
    else S.settings.cats[k] = { ...S.settings.cats[k], l:name, c:color };
    saveSettings(); closeSheet(); render();
  }
});
let qT;
document.addEventListener("input", (e) => {
  const id = e.target.id || "";
  if (id === "q") { S.f.q = e.target.value; clearTimeout(qT); qT = setTimeout(render, 200); }
  else if (id.startsWith("sim-")) updateSim();
  else if (id.startsWith("hl-")) updateHealth();
  else if (id.startsWith("ln-")) { const p = $("#loan-preview"); if (p) p.innerHTML = loanPreview(); }
  else if (id === "early") { const l = loans().find(x => x.id === e.target.dataset.loanId); if (l) $("#early-out").innerHTML = earlyOut(l, parseFloat(String(e.target.value).replace(",", ".")) || 0); }
});
document.addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "period") { S.period = e.target.value; render(); }
  if (id === "fcat") { S.f.cat = e.target.value; render(); }
  if (id === "facct") { S.f.acct = e.target.value; render(); }
  if (id === "habit-cat") { S.settings.habit.cat = e.target.value; updateSim(); }
  if (id === "sim-real") updateSim();
  if (id === "file-pdf" && e.target.files.length) { const fs = [...e.target.files]; e.target.value = ""; importFiles(fs); }
  if (id === "file-json" && e.target.files.length) { const f = e.target.files[0]; e.target.value = ""; restoreJSON(f); }
  if (id === "file-ap" && e.target.files.length) { const f = e.target.files[0]; e.target.value = ""; importApplePay(f); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); if (S.pad && /^[0-9]$/.test(e.key)) padDigit(e.key); if (S.pad && e.key === "Backspace") padDigit("del"); });
document.addEventListener("pointerdown", (e) => { const b = e.target.closest(".curve"); if (b) scrubAt(b, e.clientX); });
document.addEventListener("pointermove", (e) => { const b = e.target.closest(".curve"); if (b && (e.pointerType === "mouse" || e.buttons || e.pressure)) scrubAt(b, e.clientX); });
["pointerup", "pointercancel", "pointerleave"].forEach(n => document.addEventListener(n, (e) => { const b = e.target.closest && e.target.closest(".curve"); if (b) scrubEnd(b); }, true));
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); if (S.lock.enabled) document.body.classList.add("hiding"); }
  else { document.body.classList.remove("hiding"); if (S.lock.enabled && !S.locked && Date.now() - hiddenAt > 60000) lockNow(); }
});

/* ---------- boot ---------- */
rebuildCats();
render();
requestAnimationFrame(() => { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"; document.head.appendChild(l); });
(async () => {
  try {
    const [sts, set, lock, live] = await Promise.all([Store.get("statements"), Store.get("settings"), Store.get("lock"), Store.get("live")]);
    if (Array.isArray(sts)) S.statements = sts;
    if (set) S.settings = { ...defaults(), ...set };
    if (live) { S.live = live.live || []; S.liveDone = live.done || []; }
    if (lock && lock.enabled) { S.lock = lock; lockNow(); }
  } catch (e) { S.storeError = true; }
  S.ready = true; invalidate();
  const ap = new URLSearchParams(location.search).get("ap");
  if (ap !== null) {
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    try { const r = await ingestApplePay(ap); if (r.fresh) toast(`${plural(r.fresh, "nouveau paiement", "nouveaux paiements")} Apple Pay.`); } catch (e) {}
    S.view = "home";
  }
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
