<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes Comptes</title>
<meta name="description" content="Gérez vos relevés La Banque Postale : import PDF, catégories, budgets et analyses. Vos données restent sur votre téléphone.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes Comptes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
html{color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-column phone app — sticky header with period picker, scrolling view, fixed bottom tab bar. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F5F8F6; --fg:#13201B; --muted:#5B6B65; --line:#DCE4E0;
  --accent:#0B6E55; --accent-soft:#D5EDE5; --accent-ink:#FFFFFF;
  --in:#13803F; --warn:#B86A00; --warn-soft:#FBEBD2; --danger:#C0362C; --danger-soft:#F8DEDB;
  --shadow:0 1px 2px rgba(19,32,27,.06),0 6px 20px rgba(19,32,27,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --fg:#E6EEEA; --muted:#93A59E; --line:#26342F;
  --accent:#3CC79C; --accent-soft:#173A30; --accent-ink:#06231A;
  --in:#4ED68A; --warn:#F0A43A; --warn-soft:#3A2B12; --danger:#FF7B6E; --danger-soft:#3D1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --fg:#E6EEEA; --muted:#93A59E; --line:#26342F;
  --accent:#3CC79C; --accent-soft:#173A30; --accent-ink:#06231A;
  --in:#4ED68A; --warn:#F0A43A; --warn-soft:#3A2B12; --danger:#FF7B6E; --danger-soft:#3D1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.period{appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 32px 8px 14px;font-weight:600;font-size:14px;max-width:56vw;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}

main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:4px 0}

/* cards */
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em;text-wrap:balance}
.card h2 .sub{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* hero balance */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.hero .label{color:inherit;opacity:.8}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.03em}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.hero .pill{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;font-size:13px;flex:1;min-width:120px}
:root[data-theme="dark"] .hero .pill{background:rgba(0,0,0,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .pill{background:rgba(0,0,0,.14)}}
.hero .pill b{display:block;font-size:16px}
.verified{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;opacity:.9}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);min-width:0}
.kpi{padding:12px 10px}
.kpi b{display:block;font-size:15px;font-weight:700;margin-top:2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi .label{font-size:11px}
.pos{color:var(--in)} .neg{color:var(--fg)} .bad{color:var(--danger)}

/* donut */
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:380px){.donut-wrap{grid-template-columns:1fr}.donut-wrap svg{margin:0 auto}}
.legend{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend button{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;background:none;border:0;padding:6px 4px;border-radius:8px;text-align:left;font-size:14px;min-width:0}
.legend button:hover{background:var(--surface-2)}
.legend .dot{width:10px;height:10px;border-radius:3px}
.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* lists */
.list{display:flex;flex-direction:column}
.row-tx{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.row-tx:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;color:#fff}
.row-tx .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-tx .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-tx .a{font-weight:700;text-align:right;white-space:nowrap}
.row-tx .a small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.row-tx>div{min-width:0}
.day{display:flex;justify-content:space-between;padding:14px 2px 4px;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:capitalize}

/* filters */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.selects{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selects select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 10px;font-size:14px}
.summary-bar{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 2px}

/* budgets */
.bud{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bud .h b{font-weight:600}
.bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
.bud .edit{display:flex;gap:8px;align-items:center}
.bud input{width:110px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface-2);font-size:16px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:7px 12px;border-radius:10px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.linkish{background:none;border:0;color:var(--accent);font-weight:700;padding:0}

/* insights */
.insights{display:flex;flex-direction:column;gap:10px}
.ins{display:grid;grid-template-columns:6px 1fr;gap:12px;align-items:stretch}
.ins i{border-radius:6px;background:var(--accent)}
.ins.warn i{background:var(--warn)} .ins.bad i{background:var(--danger)}
.ins p{margin:0;font-size:14px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;white-space:nowrap}
.scroll-x{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--f-body)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:4px;background:var(--line);margin:0 auto}
.sheet .amt{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.catgrid{display:flex;flex-wrap:wrap;gap:8px}
.catgrid button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.catgrid button .dot{width:9px;height:9px;border-radius:3px}
.catgrid button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2);font-size:16px}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:50;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{font-family:var(--f-display);font-size:20px;margin:0}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stmt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stmt:last-child{border-bottom:0}
.stmt>div{min-width:0}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">Mes Comptes<small id="sub">Chargement…</small></div>
  <select class="period" id="period" aria-label="Période"></select>
</div></header>

<main><div class="wrap" id="view">
  <div class="card empty"><h3>Chargement de vos comptes…</h3><p class="muted small">Vos relevés importés vont s'afficher ici.</p></div>
</div></main>

<nav class="tabs" aria-label="Navigation"><div class="in">
  <button data-nav="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-nav="ops"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Opérations</button>
  <button data-nav="budgets"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Budgets</button>
  <button data-nav="analyse"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analyse</button>
  <button data-nav="more"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Importer</button>
</div></nav>

<input type="file" id="file-pdf" class="hidden-input" accept="application/pdf,.pdf" multiple>
<input type="file" id="file-json" class="hidden-input" accept="application/json,.json">
<div id="layer"></div>

<script>
(() => {
"use strict";

/* ---------- categories ---------- */
const CATS = {
  salaire:{l:"Salaire",c:"#178A47",k:"in"},
  aides:{l:"Aides & allocations",c:"#0E9F80",k:"in"},
  recus:{l:"Virements reçus",c:"#2E8FA8",k:"in"},
  gains:{l:"Gains de jeux",c:"#6B9E12",k:"in"},
  autres_rev:{l:"Autres revenus",c:"#57803A",k:"in"},
  logement:{l:"Logement",c:"#6D4FD8",k:"out"},
  courses:{l:"Courses",c:"#2563EB",k:"out"},
  resto:{l:"Restauration",c:"#E4631B",k:"out"},
  cafe:{l:"Café & snacks",c:"#A8691B",k:"out"},
  abos:{l:"Abonnements",c:"#D02F83",k:"out"},
  telecom:{l:"Téléphone & internet",c:"#0A8FB0",k:"out"},
  sport:{l:"Sport",c:"#1E9E52",k:"out"},
  transport:{l:"Transport",c:"#4648D4",k:"out"},
  loisirs:{l:"Loisirs & sorties",c:"#DC2F4F",k:"out"},
  shopping:{l:"Shopping",c:"#9A3FD6",k:"out"},
  sante:{l:"Santé",c:"#0F8F6B",k:"out"},
  tabac:{l:"Tabac & presse",c:"#7D736B",k:"out"},
  envoyes:{l:"Virements envoyés",c:"#0E8A8A",k:"out"},
  frais:{l:"Frais bancaires",c:"#B8322A",k:"out"},
  retraits:{l:"Retraits d'espèces",c:"#5F6F82",k:"out"},
  autres:{l:"Autres dépenses",c:"#8C9AA8",k:"out"},
  interne:{l:"Entre mes comptes",c:"#9A948E",k:"none"},
};
const OUT_CATS = Object.keys(CATS).filter(k => CATS[k].k === "out");
const RX = (s) => new RegExp("\\b(?:" + s + ")", "i");
const RULES = [
  ["salaire","in",RX("PAYE DU MOIS|PAYE\\b|SALAIRE|PAIERIE|REMUNERATION|TRAITEMENT")],
  ["aides","in",RX("CAF\\b|CPAM|AMELI|FRANCE TRAVAIL|POLE EMPLOI|CROUS|BOURSE|MSA\\b|PRIME D ACTIVITE")],
  ["gains","in",RX("FDJ|PMU|BETCLIC|WINAMAX|UNIBET|PARIONS")],
  ["logement","any",RX("LOYER|CROUS|EDF\\b|ENGIE|VEOLIA|SUEZ|SAUR\\b|ASSURANCE HAB|FONCIA|NEXITY|TOTALENERGIES ELEC")],
  ["abos","any",RX("NORTON|APPLE\\.COM|NETFLIX|SPOTIFY|DEEZER|DISNEY|AMAZON PRIME|PRIME VIDEO|CANAL\\+|CANAL PLUS|YOUTUBE|GOOGLE|PLAYSTATION|XBOX|MICROSOFT|ADOBE|OPENAI|CHATGPT|ANTHROPIC|ICLOUD|DAZN|MOLOTOV|AUDIBLE")],
  ["telecom","any",RX("SFR\\b|ORANGE\\b|BOUYGUES|FREE MOBILE|FREE TELECOM|SOSH|RED BY|B AND YOU|LA POSTE MOBILE")],
  ["sport","any",RX("BASIC ?FIT|FITNESS|DECATHLON|INTERSPORT|KEEP COOL|ON AIR\\b|CLUB SPORT")],
  ["resto","any",RX("MCDONALD|MC DONALD|KFC|BURGER|QUICK\\b|SUBWAY|O'?TACOS|DOMINO|PIZZ|SUSHI|KEBAB|RESTAU|BRASSERIE|FOOD|MIAM|DELIZIOSI|SAMREST|UBER ?EATS|DELIVEROO|JUST EAT|FIVE GUYS")],
  ["cafe","any",RX("MAXICOFFEE|SELECTA|COFFEE|CAFE|STARBUCKS|BOULANGERIE|PATISS|DISTRI")],
  ["courses","any",RX("CARREFOUR|ALDI\\b|LIDL|LECLERC|AUCHAN|INTERMARCHE|SUPER U\\b|HYPER U\\b|SYSTEME U|U EXPRESS|MONOPRIX|CASINO|FRANPRIX|SPAR\\b|PICARD|GRAND FRAIS|BIOCOOP|NETTO\\b|LEADER PRICE|CORA\\b|MATCH\\b|PROXI\\b|PRIMEUR")],
  ["transport","any",RX("SNCF|OUIGO|TOTAL\\b|ESSO|SHELL|AVIA\\b|BP\\b|CARBURANT|STATION|PEAGE|VINCI|SANEF|APRR|UBER\\b|BOLT\\b|BLABLACAR|FLIXBUS|RATP|PARKING|INDIGO")],
  ["tabac","any",RX("TABAC|RELAY|REL |PRESSE")],
  ["loisirs","any",RX("CINEMA|CGR\\b|PATHE|GAUMONT|MEGARAMA|FNAC|STEAM|BOWLING|RAFTING|WEEK ?END|CONCERT|TICKETMASTER|BILLET|FESTIVAL|ESCAPE|LASER|KARTING|FDJ|PMU|BETCLIC|WINAMAX|MUSEE")],
  ["shopping","any",RX("AMAZON|ZARA|H&M|KIABI|PRIMARK|ACTION\\b|CDISCOUNT|SHEIN|TEMU|JD SPORTS|NIKE|ADIDAS|IKEA|CELIO|JULES\\b|BERSHKA|SEPHORA|NOCIBE|LEROY MERLIN|CASTORAMA|DARTY|BOULANGER\\b|ALIEXPRESS|VINTED|ZALANDO")],
  ["sante","any",RX("PHARMA|MEDECIN|DOCTEUR|DENTISTE|MUTUELLE|OPTIC|LABO\\b|KINE|HOPITAL|CLINIQUE|DOCTOLIB")],
  ["frais","any",RX("COTISATION|FRAIS|COMMISSION|AGIOS|INTERETS DEB|OFFRE GROUPEE|FORMULE DE COMPTE")],
  ["retraits","out",RX("RETRAIT|DAB\\b")],
];

/* ---------- state ---------- */
const S = {
  statements: [], settings: { budgets:{}, rules:{}, overrides:{}, notes:{} },
  view: "home", period: "", ready: false, db: null, dl: null, offline: false,
  f: { q:"", kind:"all", cat:"", acct:"" }, editBudget: null, confirm: null, importMsg: null,
};
try { const v = localStorage.getItem("mc.view"); if (v) S.view = v; } catch (e) {}

/* ---------- persistence: IndexedDB on this phone, localStorage as fallback ---------- */
const Store = {
  db: null,
  open() {
    if (!this.db) this.db = new Promise((res, rej) => {
      const r = indexedDB.open("mes-comptes", 1);

  },
  async get(k) {
    try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
    catch (e) { try { return JSON.parse(localStorage.getItem("mc." + k) || "null"); } catch (e2) { return null; } }
  },
  async set(k, v) {
    try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
    catch (e) { localStorage.setItem("mc." + k, JSON.stringify(v)); }
  },
};

  const body = JSON.parse(JSON.stringify(v));

}

async function importFiles(files) {
  const msgs = [];
  S.importMsg = [["", "Lecture en cours…"]]; render();
  for (const f of files) {
    try {
      const st = await window.__mesComptes.parseBuffer(await f.arrayBuffer());
      if (!st.txs.length) throw new Error("vide");
      const existed = S.statements.some(s => s.id === st.id);
      await saveStatement(st);
      const ok = st.accounts.every(a => a.ok !== false);
      msgs.push([ok ? "" : "warn", `<b>${esc(periodName(st))}</b> : ${st.txs.length} opérations ${existed ? "mises à jour" : "importées"}. ${ok ? "Les totaux correspondent au relevé." : "Un total ne correspond pas : vérifiez les opérations."}`]);
      S.period = st.id;
    } catch (e) {
      console.error(e);
      msgs.push(["bad", `<b>${esc(f.name)}</b> n'a pas pu être lu. Vérifiez que c'est bien un relevé de compte La Banque Postale au format PDF.`]);
    }
  }
  S.importMsg = msgs; render();
}
async function saveFile(filename, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: type || "application/octet-stream" });
  const file = new File([blob], filename, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportCSV() {
  const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [["Date","Compte","Marchand","Libellé","Détail","Catégorie","Montant","Note"].join(";")];
  for (const t of [...allTx()].reverse()) lines.push([t.date.split("-").reverse().join("/"), q(t.acct), q(title(t.merchant)), q(t.title), q(t.detail), q(CATS[t.cat].l), t.amount.toFixed(2).replace(".", ","), q(S.settings.notes[t.id] || "")].join(";"));
  saveFile("operations.csv", "﻿" + lines.join("\r\n"), "text/csv");
}
async function restoreJSON(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.statements)) throw new Error("format");
    for (const st of data.statements) await saveStatement(st);
    if (data.settings) { S.settings = { budgets:{}, rules:{}, overrides:{}, notes:{}, ...data.settings }; saveSettings(); }
    toast(`${data.statements.length} relevé(s) restauré(s).`); render();
  } catch (e) { toast("Ce fichier n'est pas une sauvegarde Mes Comptes."); }
}

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-nav],[data-act],[data-tx],[data-cat],[data-kind],[data-setcat]");
  if (!el) return;
  if (el.matches(".scrim") && e.target.closest("[data-stop]")) return;
  if (el.dataset.nav) { go(el.dataset.nav); return; }
  if (el.dataset.setcat) {
    const t = allTx().find(x => x.id === el.dataset.tx); const k = el.dataset.setcat;
    const all = $("#apply-all") ? $("#apply-all").checked : false;
    if (all) { S.settings.rules[t.key] = k; for (const x of allTx()) if (x.key === t.key) delete S.settings.overrides[x.id]; }
    else S.settings.overrides[t.id] = k;
    saveSettings(); render(); openSheet(sheetTx(t.id)); toast(all ? `Classé en « ${CATS[k].l} » pour toutes ses opérations.` : `Classé en « ${CATS[k].l} ».`);
    return;
  }
  if (el.dataset.cat) { S.f = { q:"", kind:"all", cat:el.dataset.cat, acct:"" }; go("ops"); return; }
  if (el.dataset.kind) { S.f.kind = el.dataset.kind; render(); return; }
  const a = el.dataset.act;
  if (!a && el.dataset.tx) { openSheet(sheetTx(el.dataset.tx)); return; }
  switch (a) {
    case "close": if (el.matches(".scrim") && e.target !== el) return; closeSheet(); break;
    case "pick-pdf": $("#file-pdf").click(); break;
    case "pick-json": $("#file-json").click(); break;
    case "note-save": { const v = $("#note").value.trim(); if (v) S.settings.notes[el.dataset.tx] = v; else delete S.settings.notes[el.dataset.tx]; saveSettings(); render(); toast("Note enregistrée."); break; }
    case "bud-edit": S.editBudget = el.dataset.k; render(); setTimeout(() => { const i = $("#bud-" + el.dataset.k); if (i) i.focus(); }, 0); break;
    case "bud-clear": delete S.settings.budgets[el.dataset.k]; S.editBudget = null; saveSettings(); render(); break;
    case "bud-suggest": { const st = stats(periodTx(curStmt().id)); for (const k of OUT_CATS) if ((st.by[k] || 0) > 0 && !["envoyes","interne"].includes(k)) S.settings.budgets[k] = Math.ceil(st.by[k] / 10) * 10; saveSettings(); render(); toast("Budgets proposés. Ajustez-les à votre goût."); break; }
    case "del": S.confirm = "del:" + el.dataset.id; render(); break;
    case "del-ok": S.confirm = null; await deleteStatement(el.dataset.id); toast("Relevé supprimé."); break;
    case "rule-del": delete S.settings.rules[el.dataset.k]; saveSettings(); render(); break;
    case "export-csv": exportCSV(); break;
    case "export-json": saveFile("mes-comptes-sauvegarde.json", JSON.stringify({ app:"mes-comptes", version:1, savedAt:new Date().toISOString(), statements:S.statements, settings:S.settings }), "application/json"); break;
    case "wipe": S.confirm = "wipe"; render(); break;
    case "wipe-ok": {
      S.confirm = null;
      for (const s of [...S.statements]) await deleteStatement(s.id);
      S.settings = { budgets:{}, rules:{}, overrides:{}, notes:{} }; saveSettings(); S.importMsg = null; render(); toast("Toutes vos données ont été effacées."); break;
    }
  }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form=budget]"); if (!f) return; e.preventDefault();
  const k = f.dataset.k, v = parseFloat(String($("#bud-" + k).value).replace(",", "."));
  if (v > 0) S.settings.budgets[k] = r2(v); else delete S.settings.budgets[k];
  S.editBudget = null; saveSettings(); render(); toast("Budget enregistré.");
});
let qT;
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.f.q = e.target.value; clearTimeout(qT); qT = setTimeout(render, 150); }
});
document.addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "period") { S.period = e.target.value; render(); }
  if (id === "fcat") { S.f.cat = e.target.value; render(); }
  if (id === "facct") { S.f.acct = e.target.value; render(); }
  if (id === "file-pdf" && e.target.files.length) { const fs = [...e.target.files]; e.target.value = ""; importFiles(fs); }
  if (id === "file-json" && e.target.files.length) { const f = e.target.files[0]; e.target.value = ""; restoreJSON(f); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

/* ---------- boot ---------- */
function isStandalone() { return window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches); }
render();
requestAnimationFrame(() => { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"; document.head.appendChild(l); });
(async () => {
  try {
    const [sts, set] = await Promise.all([Store.get("statements"), Store.get("settings")]);
    if (Array.isArray(sts)) S.statements = sts;
    if (set) S.settings = { budgets:{}, rules:{}, overrides:{}, notes:{}, ...set };
  } catch (e) { S.storeError = true; }
  S.ready = true; invalidate(); render();
  if (S.statements.length && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
